<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)" />
<meta name="theme-color" content="#f7f8fa" media="(prefers-color-scheme: light)" />
<title>Fitness · Review</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<style>
  :root {
    --bg: #0f1115;
    --panel: #161a22;
    --panel-2: #1c2230;
    --border: #262d3d;
    --text: #e6e8ee;
    --muted: #8a93a6;
    --accent: #7cc4ff;
    --ok: #62d39f;
    --warn: #f5c36b;
    --alert: #f08a8a;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f7f8fa;
      --panel: #ffffff;
      --panel-2: #f0f3f8;
      --border: #e2e6ee;
      --text: #1a1d23;
      --muted: #5f6774;
      --accent: #1566c0;
      --ok: #1f8a5a;
      --warn: #b3741b;
      --alert: #b23b3b;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    font-size: 15px;
    padding-top: env(safe-area-inset-top);
    padding-left: env(safe-area-inset-left);
    padding-right: env(safe-area-inset-right);
  }
  header {
    padding: 18px 24px 14px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    justify-content: space-between;
  }
  header .title-row { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; }
  header h1 { font-size: 18px; margin: 0; font-weight: 600; letter-spacing: 0.2px; }
  header .subtitle { color: var(--muted); font-size: 13px; }
  header .actions { display: flex; align-items: center; gap: 10px; }
  header .actions .stamp { color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
  button.icon-btn {
    background: var(--panel-2); border: 1px solid var(--border); color: var(--text);
    width: 36px; height: 36px; border-radius: 8px; cursor: pointer; font-size: 16px;
    display: inline-flex; align-items: center; justify-content: center;
    transition: transform 0.2s ease;
  }
  button.icon-btn:hover { background: var(--panel); }
  button.icon-btn[aria-busy="true"] { animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .wrap { max-width: 1200px; margin: 0 auto; padding: 20px 24px 60px; }
  .grid { display: grid; gap: 14px; }
  .countdowns { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .metrics { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
  }
  .card .label { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; }
  .card .big { font-size: 28px; font-weight: 650; margin-top: 6px; font-variant-numeric: tabular-nums; }
  .card .sub { color: var(--muted); font-size: 12px; margin-top: 4px; }
  .card .pill {
    display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 999px;
    background: var(--panel-2); color: var(--muted); margin-left: 8px;
  }
  .tag-ok { color: var(--ok); }
  .tag-warn { color: var(--warn); }
  .tag-alert { color: var(--alert); }

  .section-title {
    margin: 28px 0 10px;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--muted);
    font-weight: 500;
  }

  .phase-bar {
    display: flex; gap: 2px; border-radius: 10px; overflow: hidden;
    border: 1px solid var(--border);
  }
  .phase-seg {
    flex: var(--w, 1);
    padding: 12px 14px;
    background: var(--panel);
    position: relative;
    min-width: 0;
  }
  .phase-seg.active { background: linear-gradient(180deg, rgba(124,196,255,0.18), rgba(124,196,255,0.06)); }
  .phase-seg .phase-name { font-weight: 600; font-size: 13px; }
  .phase-seg .phase-dates { color: var(--muted); font-size: 11px; margin-top: 2px; }
  .phase-seg.active::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 3px;
    background: var(--accent);
  }

  .docs {
    display: grid;
    grid-template-columns: 220px 1fr;
    gap: 0;
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    min-height: 520px;
    background: var(--panel);
  }
  .doc-list { border-right: 1px solid var(--border); padding: 10px 0; background: var(--panel-2); }
  .doc-list button {
    width: 100%; text-align: left; background: transparent; border: 0;
    padding: 10px 14px; color: var(--text); cursor: pointer; font: inherit;
    border-left: 3px solid transparent;
    min-height: 44px;
  }
  .doc-list button:hover { background: rgba(255,255,255,0.04); }
  .doc-list button.active { border-left-color: var(--accent); background: rgba(124,196,255,0.07); }
  .doc-list .doc-name { font-weight: 500; font-size: 14px; }
  .doc-list .doc-meta { color: var(--muted); font-size: 11px; margin-top: 2px; }

  .doc-view { padding: 22px 26px; overflow: auto; max-height: 80vh; }
  .doc-view .toolbar {
    display: flex; gap: 10px; align-items: center; margin-bottom: 12px;
    position: sticky; top: -22px; background: var(--panel); padding: 10px 0; z-index: 1;
    margin-top: -10px;
  }
  .doc-view input[type="search"] {
    flex: 1; padding: 8px 10px; font: inherit; color: var(--text);
    background: var(--panel-2); border: 1px solid var(--border); border-radius: 7px;
    min-height: 36px;
  }
  .doc-view input[type="search"]:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .doc-view .status { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .doc-view .status.error { color: var(--alert); }

  .md h1, .md h2, .md h3 { line-height: 1.25; }
  .md h1 { font-size: 22px; margin: 0 0 12px; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
  .md h2 { font-size: 17px; margin: 22px 0 8px; }
  .md h3 { font-size: 14px; margin: 16px 0 6px; color: var(--accent); }
  .md p { margin: 8px 0; }
  .md ul, .md ol { padding-left: 22px; }
  .md li { margin: 3px 0; }
  .md code { background: var(--panel-2); padding: 1px 5px; border-radius: 4px; font-family: var(--mono); font-size: 13px; }
  .md pre { background: var(--panel-2); padding: 10px 12px; border-radius: 8px; overflow: auto; }
  .md pre code { background: transparent; padding: 0; }
  .md blockquote { border-left: 3px solid var(--accent); padding: 2px 12px; color: var(--muted); margin: 10px 0; }
  .md table {
    border-collapse: collapse; width: 100%; margin: 10px 0; font-size: 13px;
    font-variant-numeric: tabular-nums;
  }
  .md th, .md td {
    padding: 6px 10px; border-bottom: 1px solid var(--border); text-align: left;
    vertical-align: top;
  }
  .md th { background: var(--panel-2); font-weight: 600; }
  .md tr:hover td { background: rgba(124,196,255,0.04); }

  mark { background: #ffe58a; color: #000; padding: 0 1px; border-radius: 2px; }

  .banner {
    margin: 0 0 14px;
    padding: 10px 14px;
    border-radius: 8px;
    background: rgba(240, 138, 138, 0.12);
    border: 1px solid rgba(240, 138, 138, 0.4);
    color: var(--alert);
    font-size: 13px;
  }
  .banner.warn {
    background: rgba(245, 195, 107, 0.12);
    border-color: rgba(245, 195, 107, 0.4);
    color: var(--warn);
  }

  .skel {
    background: linear-gradient(90deg, var(--panel-2) 0%, var(--border) 50%, var(--panel-2) 100%);
    background-size: 200% 100%;
    animation: shimmer 1.4s linear infinite;
    border-radius: 4px;
    color: transparent !important;
    user-select: none;
  }
  @keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }

  @media (max-width: 820px) {
    header { padding: 14px 16px; }
    .wrap { padding: 14px 16px 60px; }
    .countdowns, .metrics { grid-template-columns: repeat(2, 1fr); }
    .docs { grid-template-columns: 1fr; min-height: 0; }
    .doc-list {
      border-right: 0; border-bottom: 1px solid var(--border);
      display: flex; overflow-x: auto; padding: 8px; gap: 4px;
      -webkit-overflow-scrolling: touch;
    }
    .doc-list button {
      width: auto; white-space: nowrap; border-left: 0;
      border-bottom: 3px solid transparent; border-radius: 6px;
    }
    .doc-list button.active { border-left-color: transparent; border-bottom-color: var(--accent); }
    .doc-view { max-height: none; padding: 16px 18px; }
    .phase-bar { flex-direction: column; }
    .phase-seg.active::after { left: 0; top: 0; bottom: 0; width: 3px; height: auto; right: auto; }
  }
</style>
</head>
<body>

<header>
  <div class="title-row">
    <h1>Fitness · Review</h1>
    <span class="subtitle" id="subtitle"></span>
  </div>
  <div class="actions">
    <span class="stamp" id="fetchStamp"></span>
    <button class="icon-btn" id="refresh" title="Refresh data" aria-label="Refresh data">↻</button>
  </div>
</header>

<main class="wrap">

  <div id="errorBanner"></div>

  <div class="section-title">Upcoming races</div>
  <div class="grid countdowns" id="countdowns"></div>

  <div class="section-title">Current snapshot</div>
  <div class="grid metrics" id="metrics"></div>

  <div class="section-title">2026 macro phase</div>
  <div class="phase-bar" id="phaseBar"></div>

  <div class="section-title">Documents</div>
  <div class="docs">
    <nav class="doc-list" id="docList" aria-label="Documents"></nav>
    <section class="doc-view">
      <div class="toolbar">
        <input type="search" id="search" placeholder="Search within this document…" />
        <span class="status" id="docStatus"></span>
      </div>
      <article id="docBody" class="md"></article>
    </section>
  </div>

</main>

<script>
/* --------------------------------------------------------------------------
   CONFIG — edit this when stable facts change (new races, new phases, etc.)
   Dynamic data (metrics, weekly log) is parsed from the .md files at runtime.
   -------------------------------------------------------------------------- */

const CONFIG = {
  athlete: { name: "Joseph", age: 39, location: "South Whidbey" },

  races: [
    { name: "Whidbey Half",        date: "2026-04-26", tier: "B", note: "Target 2:10" },
    { name: "Seattle to Portland", date: "2026-07-11", tier: "A", note: "~206 mi, 1-day stretch" },
    { name: "Seattle Marathon",    date: "2026-11-29", tier: "A", note: "First marathon" },
  ],

  phases: [
    { name: "Half taper",     start: "2026-04-17", end: "2026-04-26" },
    { name: "STP build",      start: "2026-04-27", end: "2026-07-11" },
    { name: "STP recovery",   start: "2026-07-13", end: "2026-07-26" },
    { name: "Marathon build", start: "2026-07-27", end: "2026-11-29" },
  ],

  // Order here drives tab order. First one is the default tab.
  docs: [
    { file: "fitness-baseline.md", title: "Fitness Baseline" },
    { file: "week-log.md",         title: "Week Log" },
    { file: "macro-plan.md",       title: "Macro Plan" },
    { file: "workout-library.md",  title: "Workout Library" },
  ],
};

/* --------------------------------------------------------------------------
   STATE
   -------------------------------------------------------------------------- */

const state = {
  docs: {},          // filename -> { title, body, bytes, error }
  currentDoc: CONFIG.docs[0].file,
  lastFetched: null,
  loadErrors: [],
};

const $ = sel => document.querySelector(sel);

/* --------------------------------------------------------------------------
   DATA LOADING
   -------------------------------------------------------------------------- */

async function loadDocs() {
  state.loadErrors = [];
  const bust = Date.now();
  const results = await Promise.allSettled(
    CONFIG.docs.map(async d => {
      const res = await fetch(`${d.file}?t=${bust}`, { cache: "no-store" });
      if (!res.ok) throw new Error(`${d.file}: HTTP ${res.status}`);
      const body = await res.text();
      return { ...d, body, bytes: new Blob([body]).size };
    })
  );
  results.forEach((r, i) => {
    const d = CONFIG.docs[i];
    if (r.status === "fulfilled") {
      state.docs[d.file] = r.value;
    } else {
      state.docs[d.file] = { ...d, body: `# ${d.title}\n\n*Failed to load — ${r.reason.message}*`, bytes: 0, error: true };
      state.loadErrors.push(r.reason.message);
    }
  });
  state.lastFetched = new Date();
}

/* --------------------------------------------------------------------------
   MARKDOWN TABLE EXTRACTION
   Finds the first markdown table after a heading that matches the predicate.
   Tables are parsed into { headers: [], rows: [{...}] }.
   -------------------------------------------------------------------------- */

function extractTable(md, headingMatches) {
  const lines = md.split("\n");
  let lookingForTable = false;
  let rawRows = [];

  for (const line of lines) {
    const h = line.match(/^(#{1,6})\s+(.+?)\s*$/);
    if (h) {
      if (rawRows.length) break;                 // hit next heading after a found table
      lookingForTable = headingMatches(h[2]);
      continue;
    }
    if (!lookingForTable) continue;

    const t = line.trim();
    if (!t.startsWith("|")) {
      if (rawRows.length) break;                 // table ended
      continue;                                  // still waiting for table start
    }
    if (/^\|[\s\-:|]+\|$/.test(t)) continue;     // separator row

    const cells = t.replace(/^\|/, "").replace(/\|$/, "").split("|").map(s => s.trim());
    rawRows.push(cells);
  }

  if (rawRows.length < 2) return null;
  const headers = rawRows[0];
  const rows = rawRows.slice(1).map(r =>
    Object.fromEntries(headers.map((h, i) => [h, r[i] ?? ""]))
  );
  return { headers, rows };
}

/* --------------------------------------------------------------------------
   METRIC EXTRACTION — derives current-snapshot numbers from baseline.md
   -------------------------------------------------------------------------- */

function extractMetrics() {
  const baseline = state.docs["fitness-baseline.md"]?.body || "";
  const out = [];

  const body = extractTable(baseline, h => h.trim() === "Body");
  if (body?.rows.length) {
    const latest = body.rows[body.rows.length - 1];
    out.push({ label: "Weight", big: latest["Weight"], sub: latest["Notes"] || "" });
  }

  const ftp = extractTable(baseline, h => h.startsWith("FTP History"));
  if (ftp?.rows.length) {
    const latest = ftp.rows[ftp.rows.length - 1];
    out.push({
      label: "FTP",
      big: `${latest["FTP (W)"]} W`,
      sub: `${latest["W/kg"]} W/kg · tested ${latest["Date"]}`,
    });
  }

  const vo2 = extractTable(baseline, h => h.startsWith("Cardio Fitness"));
  if (vo2?.rows.length) {
    const latest = vo2.rows[vo2.rows.length - 1];
    const peak = vo2.rows.reduce((a, b) =>
      parseFloat(a["VO₂ max"]) >= parseFloat(b["VO₂ max"]) ? a : b
    );
    const peakNote = peak === latest
      ? `Latest · peak value (${latest["Date"]})`
      : `Latest · peak ${peak["VO₂ max"]} on ${peak["Date"]}`;
    out.push({ label: "VO₂ max", big: latest["VO₂ max"], sub: peakNote });
  }

  const hr = extractTable(baseline, h => h.trim() === "Heart Rate");
  if (hr?.rows.length) {
    const maxRow = hr.rows.find(r => /max hr observed/i.test(r["Metric"] || ""));
    const rhrRow = hr.rows.find(r => /^resting hr$/i.test(r["Metric"] || ""));
    if (maxRow) {
      const sub = rhrRow ? `RHR ${rhrRow["Value"]}` : maxRow["Source"];
      out.push({ label: "Max HR", big: maxRow["Value"], sub });
    }
  }

  return out;
}

/* --------------------------------------------------------------------------
   RENDERING
   -------------------------------------------------------------------------- */

const today = () => new Date();
const daysBetween = (a, b) => Math.round((b - a) / 86400000);
const fmtDate = d => d.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });
const fmtTime = d => d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });

function renderHeader() {
  const now = today();
  const dateStr = now.toLocaleDateString(undefined, { weekday: "long", year: "numeric", month: "long", day: "numeric" });
  $("#subtitle").textContent = `${CONFIG.athlete.name} · ${CONFIG.athlete.age} · ${CONFIG.athlete.location} · ${dateStr}`;
  $("#fetchStamp").textContent = state.lastFetched ? `fetched ${fmtTime(state.lastFetched)}` : "";
}

function renderErrorBanner() {
  const host = $("#errorBanner");
  if (!state.loadErrors.length) { host.innerHTML = ""; return; }
  host.innerHTML = `<div class="banner">Couldn't load ${state.loadErrors.length} file${state.loadErrors.length > 1 ? "s" : ""}: ${state.loadErrors.map(e => e.replace(/: HTTP \d+/, "")).join(", ")}</div>`;
}

function renderCountdowns() {
  const now = today();
  const host = $("#countdowns");
  host.innerHTML = CONFIG.races.map(r => {
    const d = new Date(r.date + "T00:00:00");
    const days = daysBetween(now, d);
    const klass = days < 0 ? "tag-ok" : r.tier === "A" ? "tag-alert" : "tag-warn";
    const weeksOut = (days / 7).toFixed(1);
    const label = days < 0 ? "complete" : days === 0 ? "today" : `${days} <span style="font-size:14px;color:var(--muted);font-weight:500;">days out</span>`;
    const meta = days < 0 ? `${fmtDate(d)} · ${r.note}` : `${fmtDate(d)} · ${weeksOut} weeks · ${r.note}`;
    return `<div class="card">
      <div class="label"><span class="${klass}">${r.tier}-race</span> · ${r.name}</div>
      <div class="big">${label}</div>
      <div class="sub">${meta}</div>
    </div>`;
  }).join("");
}

function renderMetrics() {
  const metrics = extractMetrics();
  const host = $("#metrics");
  if (!metrics.length) {
    host.innerHTML = `<div class="card" style="grid-column:1/-1;"><div class="sub">Couldn't parse metrics from fitness-baseline.md — check table structure.</div></div>`;
    return;
  }
  host.innerHTML = metrics.map(m =>
    `<div class="card">
      <div class="label">${m.label}</div>
      <div class="big">${m.big || "—"}</div>
      <div class="sub">${m.sub || ""}</div>
    </div>`
  ).join("");
}

function renderPhaseBar() {
  const now = today();
  const host = $("#phaseBar");
  const segs = CONFIG.phases.map(p => {
    const s = new Date(p.start + "T00:00:00");
    const e = new Date(p.end + "T00:00:00");
    const days = Math.max(1, daysBetween(s, e));
    const active = now >= s && now <= e;
    return { ...p, s, e, days, active };
  });
  host.innerHTML = segs.map(p =>
    `<div class="phase-seg ${p.active ? "active" : ""}" style="--w:${p.days}">
      <div class="phase-name">${p.name}${p.active ? ' <span class="pill">current</span>' : ""}</div>
      <div class="phase-dates">${p.s.toLocaleDateString(undefined, { month: "short", day: "numeric" })} – ${p.e.toLocaleDateString(undefined, { month: "short", day: "numeric" })}</div>
    </div>`
  ).join("");
}

function renderDocList() {
  const host = $("#docList");
  host.innerHTML = CONFIG.docs.map(d => {
    const loaded = state.docs[d.file];
    const bytes = loaded ? loaded.bytes.toLocaleString() + " B" : "…";
    const err = loaded?.error ? ' <span class="tag-alert">!</span>' : "";
    return `<button data-doc="${d.file}" class="${d.file === state.currentDoc ? "active" : ""}">
      <div class="doc-name">${d.title}${err}</div>
      <div class="doc-meta">${d.file} · ${bytes}</div>
    </button>`;
  }).join("");
  host.onclick = e => {
    const btn = e.target.closest("button[data-doc]");
    if (!btn) return;
    state.currentDoc = btn.dataset.doc;
    // Update URL hash for deep linking / bookmarking
    const slug = btn.dataset.doc.replace(/\.md$/, "");
    history.replaceState(null, "", `#${slug}`);
    renderDocList();
    renderDoc();
  };
}

function renderDoc() {
  const doc = state.docs[state.currentDoc];
  if (!doc) return;
  const q = $("#search").value.trim();
  let html;
  try {
    html = marked.parse(doc.body);
  } catch (err) {
    html = `<pre>${escapeHtml(doc.body)}</pre>`;
  }
  if (q) {
    try {
      const esc = q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
      const rx = new RegExp(`(${esc})`, "gi");
      // Only substitute inside text between tags
      html = html.replace(/>([^<]+)</g, (_, text) => ">" + text.replace(rx, "<mark>$1</mark>") + "<");
    } catch (_) {}
  }
  $("#docBody").innerHTML = html;

  const status = $("#docStatus");
  status.className = "status" + (doc.error ? " error" : "");
  status.textContent = doc.error ? "load error" : "";

  // For week-log: newest entries are at the bottom — scroll there by default when first opening
  const view = document.querySelector(".doc-view");
  if (state.currentDoc === "week-log.md" && !q) {
    requestAnimationFrame(() => { view.scrollTop = view.scrollHeight; });
  } else {
    view.scrollTop = 0;
  }
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

/* --------------------------------------------------------------------------
   INIT & EVENTS
   -------------------------------------------------------------------------- */

function applyInitialHash() {
  const hash = location.hash.slice(1);
  if (!hash) return;
  const match = CONFIG.docs.find(d => d.file.replace(/\.md$/, "") === hash);
  if (match) state.currentDoc = match.file;
}

async function refresh() {
  const btn = $("#refresh");
  btn.setAttribute("aria-busy", "true");
  try {
    await loadDocs();
    renderAll();
  } finally {
    btn.removeAttribute("aria-busy");
  }
}

function renderAll() {
  renderHeader();
  renderErrorBanner();
  renderCountdowns();
  renderMetrics();
  renderPhaseBar();
  renderDocList();
  renderDoc();
}

async function init() {
  applyInitialHash();
  // Paint static bits immediately so the page feels responsive.
  renderHeader();
  renderCountdowns();
  renderPhaseBar();

  $("#refresh").addEventListener("click", refresh);
  $("#search").addEventListener("input", renderDoc);
  window.addEventListener("hashchange", () => {
    applyInitialHash();
    renderDocList();
    renderDoc();
  });

  await loadDocs();
  renderAll();
}
